name: Publish reviewed inflation release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag pointing to the reviewed main commit
        required: true
        type: string
      reviewed_commit:
        description: Exact reviewed 40-character main commit SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: reviewed-inflation-release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
  REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check dispatch and existing refs before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py --check
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify retained study and current official-document agreement
        run: |
          python scripts/restore_frozen_model.py
          python scripts/reproduce_numeric_results.py
          python scripts/audit_current_sources.py --cache work/release/source_pages --output work/release/current_source_comparison.json
          python scripts/build_demo.py
          node tests/check_explorer.cjs
          python scripts/verify_demo_links.py
          git diff --exit-code -- docs/index.html docs/exports/ reports/demo_build.json
      - name: Recheck refs after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py --check
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck existing tag and main before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py --publish
