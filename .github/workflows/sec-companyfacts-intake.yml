name: SEC companyfacts source intake
on:
  push:
    branches: [public-source-intake-20261019]
    paths:
      - .github/workflows/sec-companyfacts-intake.yml
      - supporting/sec_companyfacts/**
permissions:
  contents: read
concurrency:
  group: sec-companyfacts-20261019
  cancel-in-progress: false
jobs:
  public-companyfacts-resource:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Request companyfacts once; do not retry declined registry/submissions
        run: python3 supporting/sec_companyfacts/fetch_companyfacts.py
