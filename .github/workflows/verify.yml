name: Verify public research
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/check_explorer.cjs
      - run: python scripts/reproduce_numeric_results.py
      - name: Rebuild current explorer without changing frozen results
        run: |
          python scripts/restore_frozen_model.py
          python scripts/build_demo.py
          python scripts/verify_demo_links.py
          git diff --exit-code -- docs/index.html docs/exports/ reports/demo_build.json
